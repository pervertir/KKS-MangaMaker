# or older) versions only. Shippuden-era Hinata/Sakura/Ino/Tenten/Temari (15-17), all genin and
# Boruto's kids are excluded on purpose, and the downloader refuses any LoRA whose name, tags or
# trigger words hit mp/civitai.py BLOCKLIST, even if someone adds it here. See docker/README.md.

base:
