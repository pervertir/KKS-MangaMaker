# Extra refusals on top of mp/civitai.py BLOCKLIST (minors, child-era versions, loli/shota styles,
# Boruto's kids by name). Whole words, checked against model name, tags, version name, trigger words.
blocklist: []

# Civitai LoRAs. `sets` picks which groups to fetch (MANGA_LORA_SETS=all, or e.g. "characters").
# `character`/`series` are what you write in shot.yaml; the downloader registers each file under
# that name, so `lora: auto` finds the bundled file instead of searching Civitai again.
